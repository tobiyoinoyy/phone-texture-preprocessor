[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-texture-preprocessor"
version = "1.3.0"
description = "Phone six-view standardization, frame deskew and UV-aware structure alignment"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["Pillow>=10", "numpy>=1.24,<2", "scipy>=1.10", "opencv-python-headless>=4.8,<4.12"]

[project.optional-dependencies]
cutout = ["torch>=2.5", "torchvision>=0.20", "transformers>=4.45,<5", "accelerate>=0.30", "huggingface-hub>=0.25", "safetensors>=0.4", "timm>=1.0", "kornia>=0.7", "einops>=0.7"]
test = ["pytest>=7"]

[project.scripts]
phone-texture = "phone_texture.cli:main"
phone-normalizer = "phone_normalizer.cli:main"
phone-normalizer-uv = "phone_normalizer.uv_cli:main"

[tool.setuptools.package-data]
phone_normalizer = ["profiles/*.json"]
texture_alignment = ["annotator.html"]

[tool.setuptools.packages.find]
where = ["."]
include = ["phone_texture*", "phone_normalizer*", "texture_alignment*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
